services:
  # --- API: the LangGraph agent behind HTTP ---
  - type: web
    name: langgraph-chatbot-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.app:app --app-dir src --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: ALPHAVANTAGE_API_KEY
        sync: false
      # Render's disk is ephemeral on the free plan — keep history in memory.
      - key: CHECKPOINTER
        value: memory

  # --- Frontend: Streamlit UI that talks to the API over HTTP ---
  - type: web
    name: langgraph-chatbot-ui
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run src/frontend/streamlit_frontend.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # `fromService`/`property: host` returns the private-network hostname
      # (no .onrender.com), which the UI can't resolve. Set this by hand in
      # the Render dashboard to the API service's real public URL, e.g.
      # https://langgraph-chatbot-api-26dw.onrender.com
      - key: API_BASE_URL
        sync: false
