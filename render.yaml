services:
  # --- API: the LangGraph agent behind HTTP ---
  - type: web
    name: langgraph-chatbot-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.app:app --app-dir src --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: ALPHAVANTAGE_API_KEY
        sync: false
      # Render's disk is ephemeral on the free plan — keep history in memory.
      - key: CHECKPOINTER
        value: memory

