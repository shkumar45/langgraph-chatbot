# Runs the API and the Streamlit UI on one private network.
#
#   docker compose up -d --build     # build images + start both services
#   docker compose logs -f api
#   docker compose down              # stop (add -v to also wipe chat history)
#
# The UI reaches the API by service name (http://api:8000); only the UI is
# exposed publicly. Secrets come from .env (values must NOT be quoted).

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: skumar45/langgraph-chatbot-backend:latest
    env_file: .env
    environment:
      # Pinned here so a stale value in .env can't move the server.
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      CHECKPOINTER: sqlite
      CHECKPOINT_DB: /data/chatbot.db
    volumes:
      - api-data:/data
    # Loopback only: lets you `curl localhost:8000/health` from the host
    # without exposing the API to the network (e.g. on EC2).
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      # python:3.11-slim has no curl, so probe with the stdlib.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 3
      # Startup may wait up to MCP_TOOLS_TIMEOUT (25s) on the MCP server.
      start_period: 40s
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: skumar45/langgraph-chatbot-frontend:latest
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api-data:
